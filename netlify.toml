[build]
  command = "npm run build"
  publish = "."

[build.environment]
  PUBLIC_URL = "https://porenhuang.com/"

[[redirects]]
  from = "http://porenhuang.com/*"
  to = "https://porenhuang.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.porenhuang.com/*"
  to = "https://porenhuang.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.porenhuang.com/*"
  to = "https://porenhuang.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/works/:slug"
  to = "/works/:slug.html"
  status = 200

[[redirects]]
  from = "/:page"
  to = "/:page.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Every versioned static asset can be kept locally by the browser. HTML remains
# uncached so content, navigation and page metadata still update immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
