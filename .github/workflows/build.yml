name: Build static works

on:
  push:
    branches: [main]
    paths:
      - data/works.json
      - templates/**
      - scripts/build.js
      - assets/works-filter.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works works.html sitemap.xml index.html about.html
          git diff --cached --quiet || git commit -m "Build static work pages"
          git push
